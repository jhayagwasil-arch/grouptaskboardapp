<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Group Task Board</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="description" content="A mobile-friendly group task board with login, Kanban columns, and profile avatars." />

  <!-- Icons (Generated from your new image) -->
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- App styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="auth-container" class="container">
    <div class="auth-header">
      <h1 class="app-title"><i class="fa-solid fa-list-check"></i> Group Task Board</h1>
      <button id="theme-toggle-auth" class="icon-btn theme-btn" title="Toggle Theme">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>
    <p class="subtitle">Jay Agwasil</p>

    <!-- Login Form -->
    <form id="login-form" class="auth-form" novalidate>
      <h2>Login</h2>
      <input type="email" id="login-username" placeholder="Email" required />

      <div class="password-wrapper">
        <input type="password" id="login-password" placeholder="Password" required />
        <i class="fa-regular fa-eye toggle-password" data-target="login-password"></i>
      </div>

      <button type="submit" class="primary-btn ripple">Login</button>
      <p class="switch-link">Don't have an account? <a href="#" id="show-register">Register</a></p>
    </form>

    <!-- Register Form -->
    <form id="register-form" class="auth-form hidden" novalidate>
      <h2>Register</h2>
      <input type="email" id="register-username" placeholder="Email" required />

      <div class="password-wrapper">
        <input type="password" id="register-password" placeholder="Password (Min 8 chars)" required />
        <i class="fa-regular fa-eye toggle-password" data-target="register-password"></i>
      </div>

      <div class="password-wrapper">
        <input type="password" id="register-confirm" placeholder="Confirm Password" required />
        <i class="fa-regular fa-eye toggle-password" data-target="register-confirm"></i>
      </div>

      <button type="submit" class="primary-btn ripple">Create Account</button>
      <p class="switch-link">Already have an account? <a href="#" id="show-login">Login</a></p>
    </form>
  </div>

  <!-- Board Section -->
  <div id="board-container" class="container hidden">
    <header class="board-header">
      <div class="header-left">
        <h1 class="app-title"><i class="fa-solid fa-list-check"></i> Group Task Board</h1>
        <p id="welcome-message" class="subtitle"></p>
      </div>
      <div class="header-right">

        <div class="profile-section" id="profile-trigger" title="Edit Profile">
          <div class="avatar" id="profile-avatar">D</div>
          <div class="profile-info">
            <span class="profile-name" id="profile-name">User</span>
            <span class="profile-role">Edit Profile</span>
          </div>
        </div>

        <button id="theme-toggle-board" class="icon-btn theme-btn" title="Toggle Theme">
          <i class="fa-solid fa-moon"></i>
        </button>
        <button id="logout-btn" class="logout-btn ripple" title="Logout">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <div class="board-actions">
      <button id="add-task-btn" class="primary-btn ripple"><i class="fa-solid fa-plus"></i> Add Task</button>
    </div>

    <div class="board-columns">
      <section class="column" data-status="todo">
        <h2 class="column-title"><span class="dot dot-todo"></span> To Do</h2>
        <div class="task-list" id="todo-list"></div>
      </section>
      <section class="column" data-status="inprogress">
        <h2 class="column-title"><span class="dot dot-progress"></span> In Progress</h2>
        <div class="task-list" id="inprogress-list"></div>
      </section>
      <section class="column" data-status="done">
        <h2 class="column-title"><span class="dot dot-done"></span> Done</h2>
        <div class="task-list" id="done-list"></div>
      </section>
    </div>
  </div>

  <!-- Task Modal -->
  <div id="task-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title">Add Task</h2>
      <form id="task-form" novalidate>
        <input type="hidden" id="task-id" />
        <label>Task Title</label>
        <input type="text" id="task-title" placeholder="E.g., Design homepage" required />
        <label>Description</label>
        <textarea id="task-desc" rows="3" placeholder="Add details..."></textarea>
        <label>Assignee</label>
        <select id="task-assignee" required></select>
        <label>Status</label>
        <select id="task-status">
          <option value="todo">To Do</option>
          <option value="inprogress">In Progress</option>
          <option value="done">Done</option>
        </select>
        <div class="modal-actions">
          <button type="submit" class="primary-btn ripple">Save Task</button>
          <button type="button" id="cancel-modal" class="secondary-btn ripple">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Profile Modal -->
  <div id="profile-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Edit Profile</h2>

      <div style="text-align: center; margin-bottom: 16px;">
        <label style="cursor: pointer; display: inline-block;">
          <input type="file" id="edit-profile-image" accept="image/*" style="display: none;">

          <img id="image-preview" src="" alt="Preview" style="display:none; width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); margin-bottom: 8px;">

          <div id="image-placeholder" style="width: 80px; height: 80px; border-radius: 50%; background: var(--border); display: inline-flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 2rem; border: 2px solid var(--primary); margin-bottom: 8px;">
            <i class="fa-solid fa-camera"></i>
          </div>
          <p style="color: var(--primary); font-size: 0.85rem; font-weight: bold;">Upload Photo</p>
        </label>
      </div>

      <label>New Username / Email</label>
      <input type="text" id="edit-profile-input" placeholder="Enter new username" />

      <div class="modal-actions">
        <button type="button" id="save-profile-btn" class="primary-btn ripple">Save Changes</button>
        <button type="button" id="cancel-profile-btn" class="secondary-btn ripple">Cancel</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="app.js"></script>
</body>
</html>
